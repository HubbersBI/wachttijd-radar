[project]
name = "wachttijd-radar-backend"
version = "0.1.0"
description = "Wachttijd-radar backend - Dutch healthcare waiting-time navigator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# Depends() and Query() in argument defaults is the FastAPI idiom, not a mutable default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
